name: Release

on:
  push:
    branches: [aarch64-release-tarballs]
    tags: ['v*']

permissions:
  contents: read

jobs:
  portable:
    name: Portable ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Debian 13 caps the glibc requirement at 2.41 and is the oldest base whose
    # Vulkan headers satisfy FFmpeg 9 and whose dav1d matches the libdav1d.so.7
    # that Arch, Arch Linux ARM and Fedora ship.
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      FFMPEG_PREFIX: /opt/skwd-ffmpeg
      STATIC_LIBS: /opt/skwd-static
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git file xz-utils binutils \
            build-essential pkg-config clang libclang-dev nasm patchelf \
            glslc libshaderc-dev glslang-dev spirv-tools libvulkan-dev \
            libasound2-dev libpulse-dev libxkbcommon-dev libwayland-dev \
            libdav1d-dev libyuv-dev libva-dev libdrm-dev zlib1g-dev

      - uses: actions/checkout@v4

      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install the pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - name: Build the private FFmpeg runtime
        run: packaging/build-ffmpeg-runtime.sh "$FFMPEG_PREFIX"

      # Debian names libyuv and shaderc libyuv.so.0 and libshaderc.so.1 where Arch
      # uses libyuv.so and libshaderc_shared.so.1, so link both statically.
      # Debian's shaderc_combined leaves out glslang and SPIRV-Tools, which
      # therefore link from their own archives.
      - name: Collect static libyuv and shaderc
        run: |
          multiarch=$(gcc -dumpmachine)
          mkdir -p "$STATIC_LIBS"
          for library in yuv shaderc_combined glslang MachineIndependent GenericCodeGen \
            OSDependent SPIRV glslang-default-resource-limits SPIRV-Tools-opt SPIRV-Tools
          do
            cp "/usr/lib/$multiarch/lib$library.a" "$STATIC_LIBS/"
          done

      - name: Build
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${triple}_LINKER=$GITHUB_WORKSPACE/packaging/link-private-ffmpeg.sh"
          export SKWD_FFMPEG_PREFIX="$FFMPEG_PREFIX"
          export FFMPEG_DIR="$FFMPEG_PREFIX"
          export PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig"
          export SHADERC_LIB_DIR="$STATIC_LIBS"
          shaderc_deps=-lglslang,-lMachineIndependent,-lGenericCodeGen,-lOSDependent,-lSPIRV
          shaderc_deps=$shaderc_deps,-lglslang-default-resource-limits,-lSPIRV-Tools-opt,-lSPIRV-Tools
          export RUSTFLAGS="-L native=$STATIC_LIBS \
            -C link-arg=-Wl,--start-group,$shaderc_deps,--end-group \
            -C link-arg=-Wl,--push-state,--as-needed,-lstdc++,--pop-state"
          cargo build --release --locked --workspace

      - name: Package
        id: package
        run: |
          SKWD_FFMPEG_PREFIX="$FFMPEG_PREFIX" scripts/build-portable.sh dist
          cd dist
          archive=$(ls skwd-paper_*_linux-${{ matrix.arch }}.tar.xz)
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Check the packaged binaries
        run: |
          stage=$(mktemp -d)
          tar -C "$stage" -xJf "dist/${{ steps.package.outputs.archive }}"
          for binary in "$stage"/usr/bin/* "$stage"/usr/lib/skwd-paper/skwd-paper-tinier; do
            file "$binary"
            readelf -d "$binary" | grep -E 'NEEDED|RUNPATH|RPATH'
            if ldd "$binary" | grep -E 'not found|libyuv|libshaderc'; then
              exit 1
            fi
          done
          bundled=$(ldd "$stage/usr/bin/skwd-wall-vk" \
            | grep -Ec 'lib(avcodec|avformat|avutil|swresample|swscale)\.so\.[0-9]+ => .*/lib/skwd-paper/')
          test "$bundled" -eq 5
          echo "max GLIBC: $(objdump -T "$stage"/usr/bin/* "$stage"/usr/lib/skwd-paper/* \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"

      - uses: actions/upload-artifact@v4
        with:
          name: skwd-paper-linux-${{ matrix.arch }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: portable
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "Portable skwd-paper $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*
